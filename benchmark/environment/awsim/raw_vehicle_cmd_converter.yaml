/raw_vehicle_cmd_converter:
  ros__parameters:
    convert_accel_cmd: true
    convert_actuation_to_steering_status: false
    convert_brake_cmd: true
    convert_steer_cmd: false
    csv_path_accel_map: /home/nit-user/autoware-new/Autoware/autoware/install/awsim_labs_vehicle_launch/share/awsim_labs_vehicle_launch/data/accel_map.csv
    csv_path_brake_map: /home/nit-user/autoware-new/Autoware/autoware/install/awsim_labs_vehicle_launch/share/awsim_labs_vehicle_launch/data/brake_map.csv
    is_debugging: false
    max_brake: 0.8
    max_steer: 10.0
    max_throttle: 0.4
    min_steer: -10.0
    qos_overrides:
      /clock:
        subscription:
          depth: 1
          durability: volatile
          history: keep_last
          reliability: best_effort
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
    use_sim_time: true
    use_steer_fb: true
    use_steer_ff: true
    use_vehicle_adaptor: false

