ScenarioModifiers:
  ScenarioModifier: []

OpenSCENARIO:
  FileHeader:
    author: 'Marija Ninković'
    date: '2026-09-09T08:04:37.736Z'
    description: 'Straight-road constant-speed controller benchmark - AWSIM test'
    revMajor: 1
    revMinor: 1

  ParameterDeclarations:
    ParameterDeclaration: []

  CatalogLocations:
    VehicleCatalog:
      Directory:
        path: $(ros2 pkg prefix --share openscenario_experimental_catalog)/vehicle

  RoadNetwork:
    LogicFile:
      filepath: '/home/nit-user/Documents/safeXloop/Marija/AWSIM/awsim_map/nishishinjuku_autoware_map/lanelet2_map.osm'
    SceneGraphFile:
      filepath: '/home/nit-user/Documents/safeXloop/Marija/AWSIM/awsim_map/nishishinjuku_autoware_map/pointcloud_map.pcd'
    TrafficSignals:
      TrafficSignalController: []

  Entities:
    ScenarioObject:
      - name: ego
        CatalogReference:
          catalogName: sample_vehicle
          entryName: sample_vehicle

        ObjectController:
          Controller:
            name: ''
            Properties:
              Property:
                - name: isEgo
                  value: 'true'
                - name: maxSpeed
                  value: '5.56'

  Storyboard:
    Init:
      Actions:
        Private:
          - entityRef: ego
            PrivateAction:

              - TeleportAction:
                  Position:
                    LanePosition:
                      laneId: '180'
                      offset: -0.0758
                      roadId: ''
                      s: 2.8544
                      Orientation:
                        h: 0.0304
                        p: 0.0
                        r: 0.0
                        type: relative

              - RoutingAction:
                  AcquirePositionAction:
                    Position:
                      LanePosition:
                        laneId: '187'
                        offset: -0.1314
                        roadId: ''
                        s: 27.5368
                        Orientation:
                          h: -0.0668
                          p: 0.0
                          r: 0.0
                          type: relative

    Story:
      - name: ''
        Act:
          - name: _EndCondition

            ManeuverGroup:
              - name: ''
                maximumExecutionCount: 1

                Actors:
                  selectTriggeringEntities: false
                  EntityRef:
                    - entityRef: ego

                Maneuver:
                  - name: ''

                    Event:

                      # SUCCESS
                      - name: ReachGoalEvent
                        priority: parallel

                        StartTrigger:
                          ConditionGroup:
                            - Condition:
                                - name: ReachGoal
                                  conditionEdge: sticky
                                  delay: 0.0

                                  ByEntityCondition:
                                    TriggeringEntities:
                                      triggeringEntitiesRule: any
                                      EntityRef:
                                        - entityRef: ego

                                    EntityCondition:
                                      ReachPositionCondition:
                                        tolerance: 1.0

                                        Position:
                                          LanePosition:
                                            laneId: '187'
                                            offset: -0.1314
                                            roadId: ''
                                            s: 27.5368

                                            Orientation:
                                              h: -0.0668
                                              p: 0.0
                                              r: 0.0
                                              type: relative

                        Action:
                          - name: ExitSuccess
                            UserDefinedAction:
                              CustomCommandAction:
                                type: exitSuccess

                      # FAILURE - samo timeout
                      - name: TimeoutEvent
                        priority: parallel

                        StartTrigger:
                          ConditionGroup:
                            - Condition:
                                - name: Timeout
                                  conditionEdge: none
                                  delay: 0.0

                                  ByValueCondition:
                                    SimulationTimeCondition:
                                      rule: greaterThan
                                      value: 180.0

                        Action:
                          - name: ExitFailure
                            UserDefinedAction:
                              CustomCommandAction:
                                type: exitFailure

            StartTrigger:
              ConditionGroup:
                - Condition:
                    - name: Start
                      conditionEdge: none
                      delay: 0.0

                      ByValueCondition:
                        SimulationTimeCondition:
                          rule: greaterThan
                          value: 0.0

    StopTrigger:
      ConditionGroup: []
