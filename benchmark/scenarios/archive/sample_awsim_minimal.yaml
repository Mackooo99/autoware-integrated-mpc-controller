ScenarioModifiers:
  ScenarioModifier: []

OpenSCENARIO:
  FileHeader:
    revMajor: 1
    revMinor: 1
    date: '2026-09-09T00:00:00.000Z'
    description: 'Minimal AWSIM smoke test - ego only'
    author: 'Marija Ninković'

  ParameterDeclarations:
    ParameterDeclaration: []

  CatalogLocations:
    VehicleCatalog:
      Directory:
        path: $(ros2 pkg prefix --share openscenario_experimental_catalog)/vehicle

  RoadNetwork:
    LogicFile:
      filepath: /home/nit-user/autoware-new/Autoware/autoware/src/simulator/scenario_simulator/map/shinjuku_map/map
    TrafficSignals:
      TrafficSignalController: []

  Entities:
    ScenarioObject:
      - name: ego
        CatalogReference:
          catalogName: sample_vehicle
          entryName: sample_vehicle
        ObjectController:
          Controller:
            name: ''
            Properties:
              Property:
                - name: isEgo
                  value: 'true'
                - name: maxSpeed
                  value: 5.0

  Storyboard:
    Init:
      Actions:
        Private:
          - entityRef: ego
            PrivateAction:
              - TeleportAction:
                  Position:
                    LanePosition:
                      roadId: ''
                      laneId: '225'
                      s: 10.0
                      offset: -0.1748
                      Orientation:
                        type: relative
                        h: 0.0
                        p: 0.0
                        r: 0.0

              - RoutingAction:
                  AcquirePositionAction:
                    Position:
                      LanePosition:
                        roadId: ''
                        laneId: '225'
                        s: 127.4177
                        offset: 0.1109
                        Orientation:
                          type: relative
                          h: 0.0
                          p: 0.0
                          r: 0.0

    Story:
      - name: ''
        Act:
          - name: _EndCondition
            ManeuverGroup:
              - maximumExecutionCount: 1
                name: ''
                Actors:
                  selectTriggeringEntities: false
                  EntityRef:
                    - entityRef: ego

                Maneuver:
                  - name: ''
                    Event:

                      # SUCCESS: ego reaches destination
                      - name: ''
                        priority: parallel
                        StartTrigger:
                          ConditionGroup:
                            - Condition:
                                - name: ReachGoal
                                  delay: 0.0
                                  conditionEdge: none
                                  ByEntityCondition:
                                    TriggeringEntities:
                                      triggeringEntitiesRule: any
                                      EntityRef:
                                        - entityRef: ego
                                    EntityCondition:
                                      ReachPositionCondition:
                                        Position:
                                          LanePosition:
                                            roadId: ''
                                            laneId: '225'
                                            s: 127.4177
                                            offset: 0.1109
                                            Orientation:
                                              type: relative
                                              h: 0.0
                                              p: 0.0
                                              r: 0.0
                                        tolerance: 1.0

                        Action:
                          - name: ''
                            UserDefinedAction:
                              CustomCommandAction:
                                type: exitSuccess

                      # FAILURE: timeout only
                      - name: ''
                        priority: parallel
                        StartTrigger:
                          ConditionGroup:
                            - Condition:
                                - name: Timeout
                                  delay: 0.0
                                  conditionEdge: none
                                  ByValueCondition:
                                    SimulationTimeCondition:
                                      value: 180.0
                                      rule: greaterThan

                        Action:
                          - name: ''
                            UserDefinedAction:
                              CustomCommandAction:
                                type: exitFailure

            StartTrigger:
              ConditionGroup:
                - Condition:
                    - name: ''
                      delay: 0.0
                      conditionEdge: none
                      ByValueCondition:
                        SimulationTimeCondition:
                          value: 0.0
                          rule: greaterThan

    StopTrigger:
      ConditionGroup: []
